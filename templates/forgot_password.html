<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BruteShield — Reset Password</title>
    <link rel="stylesheet" href="/static/css/soc-theme.css">
    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background: radial-gradient(circle at top, #0f2038 0%, #070b14 70%);
        }
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 420px;
            padding: 36px 32px;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }
        .auth-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-header h2 {
            font-size: 20px;
            color: var(--cyan-primary);
            margin-bottom: 6px;
        }
        .auth-header p {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        .auth-footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.15s;
        }
        .auth-footer a:hover {
            color: var(--cyan-primary);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Reset Your Password</h2>
                <p>Enter your username or registered email address to receive reset instructions.</p>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label class="form-label">Username or Email</label>
                    <input 
                        type="text" 
                        class="soc-input" 
                        style="width:100%;" 
                        name="identifier" 
                        placeholder="Enter username or email" 
                        required 
                    />
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; padding:10px; margin-top:8px;">
                    Send Reset Instructions
                </button>
            </form>

            {% if message %}
            <div class="soc-notice soc-notice-info" style="margin-top:18px; margin-bottom:0;">
                <div>{{ message }}</div>
                {% if reset_link_dev %}
                <div style="margin-top:10px; font-size:11px; background:#070b14; padding:8px; border-radius:4px; border:1px solid #1e293b; word-break:break-all;">
                    <strong style="color:var(--amber-warning);">[Local / Cloud Direct Link]:</strong><br>
                    <a href="{{ reset_link_dev }}" style="color:var(--cyan-primary); font-weight:600;">
                        {{ reset_link_dev }}
                    </a>
                </div>
                {% endif %}
            </div>
            {% endif %}

            <div class="auth-footer">
                <a href="/login">← Back to Login</a>
                <span>•</span>
                <a href="/signup">Create Account</a>
            </div>
        </div>
    </div>
</body>
</html>
