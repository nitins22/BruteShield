<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BruteShield - Protected Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .box {
            background: #1e293b;
            padding: 35px 40px;
            border-radius: 10px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 360px;
        }
        h2 {
            color: #38bdf8;
            margin-top: 0;
            margin-bottom: 6px;
            font-size: 22px;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 18px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            margin: 8px 0;
            box-sizing: border-box;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 11px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
            color: #94a3b8;
        }
        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.4;
        }
        .blocked {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
        }
        .warning {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid #f59e0b;
            color: #fbbf24;
        }
        .success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
        }
        .captcha-box {
            background: #0f172a;
            border: 1px solid #eab308;
            border-radius: 6px;
            padding: 10px 12px;
            margin: 12px 0;
        }
        .captcha-box p {
            margin: 0 0 6px 0;
            color: #fde047;
            font-size: 13px;
        }
        .nav-links {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
        }
        .nav-links a {
            color: #38bdf8;
            text-decoration: none;
            margin: 0 8px;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>BruteShield Login</h2>
        <div class="badge">ML BEHAVIOR SHIELD ACTIVE</div>

        <form method="POST">
            <input
                type="text"
                name="username"
                placeholder="Username (demo: admin)"
                {% if blocked %}disabled{% endif %}
                required
            />
            <input
                type="password"
                name="password"
                placeholder="Password (demo: Secure@123)"
                {% if blocked %}disabled{% endif %}
                required
            />

            {% if captcha_question %}
            <div class="captcha-box">
                <p>Security Verification: <strong>{{ captcha_question }}</strong></p>
                <input type="text" name="captcha" placeholder="Enter answer" required />
            </div>
            {% endif %}

            <button type="submit" {% if blocked %}disabled{% endif %}>Sign In</button>
        </form>

        {% if message %}
        <div class="message {% if blocked %}blocked{% elif 'successful' in message %}success{% else %}warning{% endif %}">
            {{ message }}
            {% if authenticated %}
                <div style="margin-top:8px;">
                    <a href="/vault" style="color:#38bdf8; font-weight:bold;">→ Open Encrypted Password Vault</a>
                </div>
            {% endif %}
        </div>
        {% endif %}

        <div class="nav-links">
            <a href="/signup">Create Account</a>
            <a href="/vault">Password Vault</a>
            <a href="/dashboard-login">Admin Portal</a>
        </div>
    </div>
</body>
</html>
