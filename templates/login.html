<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BruteShield — Protected User Authentication</title>
    <link rel="stylesheet" href="/static/css/soc-theme.css">
    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background: radial-gradient(circle at top, #0f2038 0%, #070b14 70%);
        }
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 400px;
            padding: 36px 32px;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }
        .auth-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-header h2 {
            font-size: 20px;
            color: var(--cyan-primary);
            margin-bottom: 6px;
        }
        .auth-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            background: var(--cyan-glow);
            color: var(--cyan-primary);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .captcha-box {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid var(--amber-warning);
            border-radius: var(--radius-md);
            padding: 12px;
            margin-bottom: 16px;
        }
        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        .auth-footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.15s;
        }
        .auth-footer a:hover {
            color: var(--cyan-primary);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>BruteShield Login</h2>
                <div class="auth-badge">ML BEHAVIOR SHIELD ACTIVE</div>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input 
                        type="text" 
                        class="soc-input" 
                        style="width:100%;" 
                        name="username" 
                        placeholder="Username (demo: admin)" 
                        {% if blocked %}disabled{% endif %} 
                        required
                    />
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input 
                        type="password" 
                        class="soc-input" 
                        style="width:100%;" 
                        name="password" 
                        placeholder="Password (demo: Secure@123)" 
                        {% if blocked %}disabled{% endif %} 
                        required
                    />
                </div>

                {% if captcha_question %}
                <div class="captcha-box">
                    <p style="color:var(--amber-warning); font-size:12px; margin-bottom:8px; font-weight:600;">
                        Security Verification: <strong>{{ captcha_question }}</strong>
                    </p>
                    <input 
                        type="text" 
                        class="soc-input" 
                        style="width:100%;" 
                        name="captcha" 
                        placeholder="Enter answer" 
                        required 
                    />
                </div>
                {% endif %}

                <button 
                    type="submit" 
                    class="btn btn-primary" 
                    style="width:100%; padding:10px; margin-top:8px;" 
                    {% if blocked %}disabled{% endif %}
                >
                    Sign In
                </button>
            </form>

            {% if message %}
            <div class="soc-notice {% if blocked %}soc-notice-danger{% elif 'successful' in message %}soc-notice-info{% else %}soc-notice-warning{% endif %}" style="margin-top:18px; margin-bottom:0;">
                <div>
                    {{ message }}
                    {% if authenticated %}
                    <div style="margin-top:8px;">
                        <a href="/vault" style="color:var(--cyan-primary); font-weight:700; text-decoration:none;">
                            → Open Encrypted Password Vault
                        </a>
                    </div>
                    {% endif %}
                </div>
            </div>
            {% endif %}

            <div class="auth-footer">
                <a href="/signup">Create Account</a>
                <span>•</span>
                <a href="/vault">Password Vault</a>
                <span>•</span>
                <a href="/dashboard-login">Admin Portal</a>
            </div>
        </div>
    </div>
</body>
</html>
