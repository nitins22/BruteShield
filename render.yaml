# BruteShield Production Infrastructure Blueprint for Render
# Defines managed PostgreSQL database and hardened Gunicorn Web Service

services:
  - type: web
    name: bruteshield-web
    env: python
    region: oregon
    plan: free
    branch: master
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BRUTESHIELD_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bruteshield-db
          property: connectionString
      - key: BRUTESHIELD_SECRET_KEY
        generateValue: true
      - key: BRUTESHIELD_VAULT_KEY
        generateValue: true
      - key: BEHIND_PROXY
        value: "true"
      - key: INITIAL_ADMIN_USER
        value: dashadmin
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_POOL_MIN
        value: "2"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: MAX_FAILED_ATTEMPTS
        value: "5"
      - key: TIME_WINDOW_SECONDS
        value: "60"
      - key: SLIDING_WINDOW_SECONDS
        value: "900"
      - key: CAPTCHA_SCORE_LIMIT
        value: "0.06"

databases:
  - name: bruteshield-db
    databaseName: bruteshield
    user: bruteshield_user
    region: oregon
    plan: free
